# Primer servicio de infraestructura: MySQL local de practica.
# Ejecutar desde la raiz: docker compose up -d
services:
  mysql-clientes:
    image: mysql:8.4
    container_name: demo-bank-mysql-clientes
    environment:
      MYSQL_DATABASE: db_client_service
      MYSQL_USER: ${DB_USER:-client_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en tu archivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en tu archivo .env}
    ports:
      - "3307:3306"
    volumes:
      - clientes_data:/var/lib/mysql

volumes:
  clientes_data:
