spring.application.name=client-service
server.port=${SERVER_PORT:8081}

# Configuracion por variables de entorno. Nunca subir contrasenas reales.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/db_client_service}
spring.datasource.username=${DB_USER:client_app}
spring.datasource.password=${DB_PASSWORD}

# Solo uso didactico local. Luego migraremos a Flyway y validacion de esquema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
