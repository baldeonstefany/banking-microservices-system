spring.application.name=account-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/db_account_service}
spring.datasource.username=${DB_USER:account_app}
spring.datasource.password=${DB_PASSWORD}
# Exclusivamente para desarrollo educativo; reemplazar por migraciones antes de desplegar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
